name = "klickundklar-website"
main = "worker/index.js"
compatibility_date = "2026-09-03"

[assets]
directory = "./"
binding = "ASSETS"
# Immer ueber den Worker: Kontaktformular-API und Videos (Range/206-Support fuer Safari/iOS).
# Ohne "/api/*" liefert not_found_handling = "404-page" eine 405-Antwort, bevor der Worker laeuft.
run_worker_first = ["/api/*", "/assets/*.mp4"]
not_found_handling = "404-page"

# Kontaktformular (/api/contact)
[vars]
CONTACT_TO = "hello@valentinmazal.at"
CONTACT_FROM = "kontakt@klickundklar.at"

[[send_email]]
name = "EMAIL"
destination_address = "hello@valentinmazal.at"

# Secret (nicht im Repo): TURNSTILE_SECRET
# -> Cloudflare Dashboard > Workers > klickundklar-website > Settings > Variables and Secrets
