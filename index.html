<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klick & Klar – Bald online</title>
  <meta name="description" content="Klick & Klar – Verein für digitale Medienbildung und Social-Media-Kompetenz. Unsere Website ist gerade im Aufbau." />
  <meta property="og:title" content="Klick & Klar – Bald online" />
  <meta property="og:description" content="Der beste Social-Media-Kompetenz-Space aller Zeiten wird gerade zusammengeschraubt." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/logo.png" />
  <meta property="og:locale" content="de_AT" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .soon {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
      background: var(--bg);
    }
    .soon__inner {
      max-width: 560px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }
    .soon__badge-wrap {
      position: relative;
      width: 100%;
      max-width: 360px;
    }
    .soon__badge-wrap::before {
      content: "";
      position: absolute;
      inset: -28px;
      z-index: -1;
      background-image: radial-gradient(var(--teal) 1.5px, transparent 2px);
      background-size: 14px 14px;
      opacity: 0.14;
      border-radius: 50%;
    }
    .soon__badge {
      width: 100%;
      height: auto;
      display: block;
    }
    .soon h1 {
      font-family: var(--font-heading);
      color: var(--navy);
      font-size: clamp(1.4rem, 3.6vw, 1.9rem);
      line-height: 1.35;
      margin: 0;
      text-wrap: balance;
    }
    .soon p.sub {
      color: var(--muted);
      font-size: 1rem;
      margin: -12px 0 0;
    }
    .soon__footer {
      margin-top: 8px;
      font-size: 0.85rem;
      color: var(--muted);
    }
    .soon__footer a {
      color: var(--muted);
      text-decoration: underline;
    }
    .soon__footer a:hover { color: var(--navy); }
  </style>
</head>
<body>

  <main class="soon">
    <div class="soon__inner">
      <div class="soon__badge-wrap">
        <img class="soon__badge" src="/assets/badge.png" alt="Klick & Klar Logo" />
      </div>

      <h1>Der beste Social-Media-Kompetenz-Space aller Zeiten wird gerade zusammengeschraubt.</h1>
      <p class="sub">Wir sind gleich zurück – mit Workshops, Selbstcheck und allem Drum und Dran.</p>

      <div class="soon__footer">
        <a href="mailto:info@klickundklar.at">info@klickundklar.at</a>
        &nbsp;·&nbsp;
        <a href="/impressum.html">Impressum</a>
        &nbsp;·&nbsp;
        <a href="/datenschutz.html">Datenschutz</a>
      </div>
    </div>
  </main>

</body>
</html>
