<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klick & Klar – Bald online</title>
  <meta name="description" content="Klick & Klar – Verein für digitale Medienbildung und Social-Media-Kompetenz. Unsere Website ist gerade im Aufbau." />
  <meta property="og:title" content="Klick & Klar – Bald online" />
  <meta property="og:description" content="Wir bauen hier gerade den besten Social-Media-Kompetenz-Space aller Zeiten." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/assets/badge.png" />
  <meta property="og:locale" content="de_AT" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .soon {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
      background: var(--color-paper);
    }
    .soon__logo {
      font-family: var(--font-heading);
      font-weight: 700;
      font-size: 1.6rem;
      text-transform: uppercase;
      color: var(--color-black);
      margin-bottom: 32px;
    }
    .soon__logo span { color: var(--color-accent-dark); margin: 0 2px; }

    .soon__art {
      width: 100%;
      max-width: 460px;
      height: auto;
      margin-bottom: 40px;
    }
    @media (prefers-reduced-motion: no-preference) {
      .soon__art { animation: soon-float 5s ease-in-out infinite; }
    }
    @keyframes soon-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .soon__quote-wrap {
      position: relative;
      max-width: 680px;
      min-height: 9rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .soon__quote {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.6s ease;
    }
    .soon__quote.is-active {
      position: relative;
      opacity: 1;
    }
    .soon__quote blockquote {
      margin: 0;
      font-family: var(--font-heading);
      font-weight: 600;
      font-size: clamp(1.4rem, 4vw, 2.1rem);
      line-height: 1.35;
      color: var(--color-black);
    }
    .soon__quote blockquote::before { content: "\201C"; color: var(--color-accent-dark); }
    .soon__quote blockquote::after { content: "\201D"; color: var(--color-accent-dark); }
    .soon__quote cite {
      display: block;
      margin-top: 14px;
      font-style: normal;
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--color-muted);
    }

    @media (prefers-reduced-motion: reduce) {
      .soon__quote { transition: none; }
    }

    .soon__tagline {
      margin-top: 56px;
      font-family: var(--font-heading);
      font-weight: 600;
      color: var(--color-black);
      font-size: clamp(1.1rem, 2.6vw, 1.5rem);
      max-width: 520px;
    }
    .soon__tagline span { color: var(--color-accent-dark); }

    .soon__footer {
      margin-top: 48px;
      font-size: 0.85rem;
      color: var(--color-muted);
    }
    .soon__footer a {
      color: var(--color-muted);
      text-decoration: underline;
    }
    .soon__footer a:hover { color: var(--color-accent-dark); }
  </style>
</head>
<body>

  <main class="soon">
    <div class="soon__logo">Klick <span>&amp;</span> Klar</div>

    <img class="soon__art" src="/assets/badge.png" alt="Illustration: Eine Retro-Rakete startet dynamisch aus einem Smartphone" />

    <div class="soon__quote-wrap" id="quote-wrap" aria-live="polite">
      <div class="soon__quote is-active">
        <blockquote>A goal without a plan is just a wish.</blockquote>
      </div>
      <div class="soon__quote">
        <blockquote>Wir haben kein Wissensproblem. Wir haben ein Umsetzungsproblem.</blockquote>
      </div>
      <div class="soon__quote">
        <blockquote>The road to hell is paved with good intentions.</blockquote>
      </div>
    </div>

    <p class="soon__tagline">
      Wir bauen hier gerade den <span>besten Social-Media-Kompetenz-Space</span> aller Zeiten.
    </p>

    <div class="soon__footer">
      <a href="mailto:info@klickundklar.at">info@klickundklar.at</a>
      &nbsp;·&nbsp;
      <a href="/impressum.html">Impressum</a>
      &nbsp;·&nbsp;
      <a href="/datenschutz.html">Datenschutz</a>
    </div>
  </main>

  <script src="/js/coming-soon.js"></script>
</body>
</html>
